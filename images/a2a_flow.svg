<svg width="100%" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" style="background:#1a1f2e;border-radius:8px;padding:10px">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text{font-family:'Segoe UI',system-ui,sans-serif;fill:#e2e8f0}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px;fill:#94a3b8}
</style>

<text class="th" x="340" y="24" text-anchor="middle">A2A communication flow</text>

<g><rect x="40" y="44" width="120" height="36" rx="6" fill="#2d3748" stroke="#4a5568" stroke-width="0.5"/>
<text class="th" x="100" y="66" text-anchor="middle">Clinician</text></g>
<g><rect x="220" y="44" width="120" height="36" rx="6" fill="#1e3a5f" stroke="#63b3ed" stroke-width="0.5"/>
<text class="th" x="280" y="66" text-anchor="middle" fill="#63b3ed">PO agent</text></g>
<g><rect x="400" y="44" width="140" height="36" rx="6" fill="#0f3d3e" stroke="#4fd1c5" stroke-width="0.5"/>
<text class="th" x="470" y="66" text-anchor="middle" fill="#4fd1c5">Discharge Guardian</text></g>
<g><rect x="580" y="44" width="70" height="36" rx="6" fill="#2d1f5e" stroke="#7f77dd" stroke-width="0.5"/>
<text class="th" x="615" y="66" text-anchor="middle" fill="#afa9ec">FHIR</text></g>

<line x1="100" y1="80" x2="100" y2="480" stroke="#4a5568" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="280" y1="80" x2="280" y2="480" stroke="#4a5568" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="470" y1="80" x2="470" y2="480" stroke="#4a5568" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="615" y1="80" x2="615" y2="480" stroke="#4a5568" stroke-width="0.5" stroke-dasharray="4 3"/>

<line x1="100" y1="110" x2="278" y2="110" stroke="#63b3ed" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="140" y="104" fill="#63b3ed">"Is this patient safe to discharge?"</text>

<line x1="280" y1="150" x2="468" y2="150" stroke="#4fd1c5" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="310" y="142" fill="#4fd1c5">A2A message/send + SHARP context</text>
<text class="ts" x="310" y="160" font-style="italic">(fhirUrl, fhirToken, patientId)</text>

<line x1="470" y1="195" x2="613" y2="195" stroke="#7f77dd" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="490" y="189" fill="#afa9ec">GET Patient, Meds, Conditions, Obs</text>

<line x1="615" y1="225" x2="472" y2="225" stroke="#7f77dd" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="500" y="219" fill="#afa9ec">FHIR Bundle (JSON)</text>

<rect x="430" y="250" width="80" height="110" rx="4" fill="#1a2332" stroke="#4a5568" stroke-width="0.5"/>
<text class="ts" x="470" y="268" text-anchor="middle" fill="#e2e8f0">Tool calls:</text>
<text class="ts" x="470" y="290" text-anchor="middle">Med analysis</text>
<text class="ts" x="470" y="308" text-anchor="middle">Lab safety</text>
<text class="ts" x="470" y="326" text-anchor="middle">Follow-up</text>
<text class="ts" x="470" y="344" text-anchor="middle">Report gen</text>

<line x1="470" y1="380" x2="282" y2="380" stroke="#4fd1c5" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="300" y="374" fill="#4fd1c5">A2A response: TASK_COMPLETED</text>
<text class="ts" x="300" y="396" font-style="italic">Discharge Safety Report (structured)</text>

<line x1="280" y1="425" x2="102" y2="425" stroke="#63b3ed" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="120" y="419" fill="#63b3ed">Formatted report with RED/YELLOW flags</text>

<text class="ts" x="100" y="462">Risk: HIGH — 4 RED flags, 4 YELLOW flags, prioritized actions</text>
<text class="ts" x="100" y="480">Time: ~60 seconds (vs 45-60 min manual review)</text>
</svg>