<svg width="100%" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" style="background:#1a1f2e;border-radius:8px;padding:10px">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text{font-family:'Segoe UI',system-ui,sans-serif;fill:#e2e8f0}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px;fill:#94a3b8}
.arr{stroke:#94a3b8;stroke-width:1.5}
</style>

<text class="th" x="340" y="28" text-anchor="middle" fill="#e2e8f0">Discharge Guardian — 4-step safety workflow</text>

<g><rect x="40" y="46" width="600" height="56" rx="8" fill="#1e3a5f" stroke="#63b3ed" stroke-width="0.5"/>
<text class="th" x="60" y="70" fill="#63b3ed">Step 1: Gather patient data</text>
<text class="ts" x="60" y="88">Query FHIR for demographics, medications, conditions, labs via SHARP token</text></g>

<line x1="340" y1="102" x2="340" y2="122" class="arr" marker-end="url(#arrow)"/>

<g><rect x="40" y="122" width="600" height="76" rx="8" fill="#4a1b0c" stroke="#d85a30" stroke-width="0.5"/>
<text class="th" x="60" y="146" fill="#f0997b">Step 2: Analyze medication changes</text>
<text class="ts" x="60" y="166">Compare pre-admission vs discharge meds for safety issues:</text>
<text class="ts" x="60" y="184">Drug interactions, contraindications, stopped meds, dose appropriateness</text></g>

<line x1="340" y1="198" x2="340" y2="218" class="arr" marker-end="url(#arrow)"/>

<g><rect x="40" y="218" width="600" height="76" rx="8" fill="#2d1f5e" stroke="#7f77dd" stroke-width="0.5"/>
<text class="th" x="60" y="242" fill="#afa9ec">Step 3: Assess lab safety</text>
<text class="ts" x="60" y="262">Cross-reference labs against discharge medications:</text>
<text class="ts" x="60" y="280">Missing monitoring labs, unsafe ranges, trending deterioration</text></g>

<line x1="340" y1="294" x2="340" y2="314" class="arr" marker-end="url(#arrow)"/>

<g><rect x="40" y="314" width="600" height="76" rx="8" fill="#0f3d3e" stroke="#4fd1c5" stroke-width="0.5"/>
<text class="th" x="60" y="338" fill="#4fd1c5">Step 4: Evaluate follow-up completeness</text>
<text class="ts" x="60" y="358">Check for missing appointments, referrals, pending tests:</text>
<text class="ts" x="60" y="376">PCP within 7 days, specialists, screenings, mental health</text></g>

<line x1="340" y1="390" x2="340" y2="410" class="arr" marker-end="url(#arrow)"/>

<g><rect x="40" y="410" width="600" height="130" rx="8" fill="#412402" stroke="#ef9f27" stroke-width="0.5"/>
<text class="th" x="60" y="434" fill="#fac775">Discharge safety report</text>
<text class="ts" x="60" y="458">1. Patient overview and readmission risk score (HIGH / MOD / LOW)</text>
<text class="ts" x="60" y="476">2. Critical findings (RED) — must address before discharge</text>
<text class="ts" x="60" y="494">3. Important findings (YELLOW) — needs attention within 1-2 weeks</text>
<text class="ts" x="60" y="512">4. Prioritized action items + safe discharge checklist</text></g>
</svg>